# إعدادات النشر على Netlify: يُنشر مجلد site كما هو بعد ختم رقم النشر في روابط الملفات (حتى لا تُعرض نسخة قديمة).
[build]
  publish = "site"
  command = 'V=${COMMIT_REF:-$(date +%s)}; sed -i "s/__BUILD__/$V/g" site/index.html site/*/index.html site/*.js'

# دالة «أضف فيلماً» (/api/add-film). تقرأ TMDB_API_KEY و GH_TOKEN و ADD_FILM_PASSWORD من متغيرات الموقع في Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# صفحات الدخول بحساب قوقل تُخدَم من نطاق الموقع نفسه (وكيل شفاف، لا تحويل)، حتى لا يعتمد الدخول على تخزين الطرف الثالث
# الذي تحجبه بعض المتصفحات (Brave مثلاً). هو نفس إعداد الدفتر. المرجع: firebase.google.com/docs/auth/web/redirect-best-practices (الخيار 3)
[[redirects]]
  from = "/__/auth/*"
  to = "https://daftar-fb.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
