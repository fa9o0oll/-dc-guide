# إعدادات النشر على Netlify: يُنشر مجلد site كما هو بعد ختم رقم النشر في روابط الملفات (حتى لا تُعرض نسخة قديمة).
[build]
  publish = "site"
  command = 'V=${COMMIT_REF:-$(date +%s)}; sed -i "s/__BUILD__/$V/g" site/index.html site/*/index.html site/*.js'
  # رصيد Netlify: كل نشر ناجح بـ15 رصيداً. كل دفع إلى main يتبعه إيداع روبوت البناء (dc-guide-bot) حاملاً الكود والبيانات معاً،
  # فكان كل تغيير يُنشر مرتين. لا يُنشر الآن إلا إيداع الروبوت، أو إيداع في عنوانه [deploy] (لما يلزم نشره فوراً بلا انتظار البناء).
  # خروج 0 = تجاهل البناء، وخروج 1 = ابنِ. المرجع: docs.netlify.com/build/configure-builds/ignore-builds
  ignore = '''git log -1 --pretty="%an|%s" | grep -Eqv "^dc-guide-bot\||\[deploy\]"'''

# دالة «أضف فيلماً» (/api/add-film). تقرأ TMDB_API_KEY و GH_TOKEN و ADD_FILM_PASSWORD من متغيرات الموقع في Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# صفحات الدخول بحساب قوقل تُخدَم من نطاق الموقع نفسه (وكيل شفاف، لا تحويل)، حتى لا يعتمد الدخول على تخزين الطرف الثالث
# الذي تحجبه بعض المتصفحات (Brave مثلاً). هو نفس إعداد الدفتر. المرجع: firebase.google.com/docs/auth/web/redirect-best-practices (الخيار 3)
[[redirects]]
  from = "/__/auth/*"
  to = "https://daftar-fb.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# صفحة الدخول تطلب إعداد المشروع من /__/firebase/init.json على النطاق نفسه، فنمرّره أيضاً (بيانات عامة، لا أسرار)
[[redirects]]
  from = "/__/firebase/*"
  to = "https://daftar-fb.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
