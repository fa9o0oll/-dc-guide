name: build-and-deploy
on:
  push:
    branches: [main, 'claude/**']
    paths: ['data/**', '!data/generated/**', 'scripts/**', 'site/**', '!site/*/data/**', '.github/workflows/data.yml']
  schedule:
    - cron: '17 3 * * *'   # يومياً 06:17 بتوقيت الرياض
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/validate.mjs
      - name: Pull live data from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/build-site-data.mjs
      - name: Report announced DC titles missing from the catalog
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/tmdb-discover.mjs
        continue-on-error: true
      - name: Look up TMDB candidates for pending queries (data/lookup)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/tmdb-lookup.mjs
        continue-on-error: true
      - name: Build base + Arrowverse order + apply our Arabic translations (fails on any gap)
        run: node scripts/build-base.mjs && node scripts/build-arrowverse.mjs && node scripts/apply-translations.mjs
      - name: Commit generated data
        if: github.ref == 'refs/heads/main'   # فروع العمل تُبنى للتحقق فقط ولا يُكتب عليها
        run: |
          git config user.name "dc-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated site/dc/data site/fate/data
          git diff --cached --quiet || git commit -m "data: daily refresh"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stamp build id (cache busting; not committed)
        if: github.ref == 'refs/heads/main'
        run: sed -i "s/__BUILD__/${GITHUB_RUN_ID}/g" site/index.html site/*/index.html site/*.js
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
