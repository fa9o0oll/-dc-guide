name: build-and-deploy
on:
  push:
    branches: [main, 'claude/**']
    # netlify/** و netlify.toml هنا لأن Netlify لا ينشر إلا إيداع روبوت البناء (انظر ignore في netlify.toml)، فكل ما يلزم نشره يمر من هذا البناء
    paths: ['data/**', '!data/generated/**', 'scripts/**', 'site/**', '!site/*/data/**', '.github/workflows/data.yml', 'netlify/**', 'netlify.toml']
  schedule:
    - cron: '17 3 * * *'   # يومياً 06:17 بتوقيت الرياض
  workflow_dispatch:
    inputs:
      anime_max:
        description: 'أنمياتي: كم عملاً يُسحب من MyAnimeList في هذا التشغيل (الافتراضي 600، نحو ثلاثة في الثانية)'
        required: false
      quiet:
        description: 'اكتب 1 ليُحفظ ما بُني بلا نشر على Netlify (سحب طويل على دفعات مثلاً). يُنشر مع أول إيداع عادي بعده'
        required: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/validate.mjs && node scripts/validate.mjs fate
      - name: Pull live data from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}   # اختياري: مفتاح واجهة MyAnimeList الرسمية لتقييمات الأنمي
        run: node scripts/build-site-data.mjs && node scripts/build-site-data.mjs fate
      - name: Build «أنمياتي» (MyAnimeList API, then Jikan; TMDB for posters and where to watch; keeps the previous data when a source is unreachable)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ANIME_PROBE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          ANIME_MAL_MAX: ${{ inputs.anime_max }}
        run: node scripts/build-anime.mjs
        continue-on-error: true
      - name: Build the episodes of «أنمياتي» (TMDB seasons, placed by the catalog mapping and checked against air dates; keeps the previous files when TMDB is unreachable)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/build-anime-episodes.mjs
        continue-on-error: true
      - name: Build the films list (match in TMDB, details, where to watch, collections)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/build-films.mjs
      - name: Build the title index for search suggestions in «أضف فيلماً» (weekly; keeps the previous file if TMDB fails)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TITLES_FORCE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          TITLES_PROBE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
        run: node scripts/build-titles.mjs
        continue-on-error: true
      - name: Build the worlds map for the films list (Wikidata + TMDB; keeps the previous file if Wikidata is unreachable)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: WORLDS_DUMP=${{ github.ref != 'refs/heads/main' && '1' || '' }} node scripts/build-worlds.mjs
        continue-on-error: true
      - name: Build «ألعابي» (IGDB + Wikidata; keeps the previous file if IGDB is unreachable)
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          GAMES_PROBE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
        run: node scripts/build-games.mjs
        continue-on-error: true
      - name: Build the game title index for suggestions in «أضف لعبة» (weekly; keeps the previous file if IGDB fails)
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          GAME_TITLES_FORCE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          GAMES_PROBE: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
        run: node scripts/build-game-titles.mjs
        continue-on-error: true
      - name: Keep the worlds map and its audit report (work branches only)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worlds
          path: |
            site/films/data/worlds.json
            data/generated/films/worlds-report.json
            site/films/data/titles.json
            site/games/data/games.json
            site/games/data/texts.json
            site/games/data/titles.json
            site/anime/data/catalog.json
            data/generated/anime/report.json
            data/generated/anime/episodes-report.json
            site/anime/data/eps/
            data/generated/build-report.json
          if-no-files-found: ignore
      - name: Report announced DC titles missing from the catalog
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/tmdb-discover.mjs
        continue-on-error: true
      - name: Look up TMDB candidates for pending queries (data/lookup)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/tmdb-lookup.mjs
        continue-on-error: true
      - name: Build base + Arrowverse order + apply our Arabic translations (fails on any gap)
        run: node scripts/build-base.mjs && node scripts/build-arrowverse.mjs && node scripts/apply-translations.mjs && node scripts/build-base.mjs fate && node scripts/apply-translations.mjs fate
      - name: Commit generated data
        if: github.ref == 'refs/heads/main'   # فروع العمل تُبنى للتحقق فقط ولا يُكتب عليها
        run: |
          git config user.name "dc-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ختم آخر إيداع ليس من الروبوت: به يتغيّر شيء مع كل تغيير في الكود ولو لم تتغيّر البيانات، فيتبعه إيداع الروبوت الذي ينشره Netlify.
          # التحديث اليومي المجدول لا يغيّره، فلا نشر في يوم لم يتغيّر فيه شيء
          if [ "$(git log -1 --pretty=%an)" != "dc-guide-bot" ]; then printf '{"commit":"%s"}\n' "$GITHUB_SHA" > site/build.json; fi
          git add data/generated site/dc/data site/fate/data site/films/data site/games/data site/anime/data site/build.json
          git diff --cached --quiet || git commit -m "data: daily refresh${{ inputs.quiet == '1' && ' [skip netlify]' || '' }}"
          # إن وصل إلى الفرع إيداع جديد أثناء البناء (ملف توثيق مثلاً) يُدمج قبل الدفع بدل أن يُرفض
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Stamp build id (cache busting; not committed)
        if: github.ref == 'refs/heads/main'
        run: sed -i "s/__BUILD__/${GITHUB_RUN_ID}/g" site/index.html site/*/index.html site/*.js
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
